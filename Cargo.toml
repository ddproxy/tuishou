[package]
name = "tuishou"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Install, update and roll the Tuishou stack from GitHub releases"
repository = "https://github.com/ddproxy/tuishou"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "serde", "std"] }
toml = "1.2"
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
