name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --features test-hooks -- -D warnings
      - name: Minimal feature set
        run: |
          cargo clippy --workspace --all-targets --locked --no-default-features --features test-hooks -- -D warnings
          cargo test --workspace --locked --no-default-features --features test-hooks
      - name: Test
        run: cargo test --workspace --locked --features test-hooks
      - name: Installer test
        run: bash tests/installer_test.sh
      - name: Docs check
        run: bash scripts/docs-check.sh
      - name: ShellCheck
        run: |
          set -eu
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck -x install.sh tests/installer_test.sh tests/fixtures/installer/*.sh scripts/*.sh
      # The runner user is already non-root. This step proves the suite does not depend on a
      # working gh CLI, an external network or a populated HOME; a unit test also checks that the
      # source never spawns gh.
      - name: Test with a failing gh first on PATH
        env:
          TUISHOU_GITHUB_API_BASE: http://127.0.0.1:1
        run: |
          set -eu
          bindir="$(mktemp -d)"
          printf '%s\n' '#!/bin/sh' 'echo "gh: token error: bad credentials" >&2' 'exit 1' > "$bindir/gh"
          chmod +x "$bindir/gh"
          mkdir -p "$bindir/home"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          env PATH="$bindir:$PATH" HOME="$bindir/home" \
            CARGO_HOME="$cargo_home" RUSTUP_HOME="$rustup_home" \
            XDG_STATE_HOME="$bindir/home/.local/state" \
            cargo test --workspace --locked --features test-hooks
