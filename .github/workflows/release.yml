name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-dev.*'
  # Dev builds are dispatched on the dev tag ref so the signing certificate
  # carries refs/tags/<tag>, which is what `tuishou verify` expects.
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    # Ubuntu runners ship host musl tools only. A static aarch64 musl binary
    # needs an aarch64 musl cross-linker; a glibc cross-compiler is not a
    # drop-in replacement. Cross-linking is opt-in: set AARCH64_MUSL_LINKER to
    # a working linker already installed on the runner (for example on a
    # self-hosted runner). Otherwise the aarch64 steps are skipped rather than
    # guessing at a toolchain and publishing a broken archive.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set release version
        run: python3 scripts/set-release-version.py set "$TAG"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Skip aarch64 without a musl cross-linker
        if: matrix.arch == 'aarch64' && vars.AARCH64_MUSL_LINKER == ''
        run: |
          echo "::notice::skipping aarch64 release target, no musl cross-linker configured"
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install musl tools
        if: matrix.arch != 'aarch64' || vars.AARCH64_MUSL_LINKER != ''
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build
        if: matrix.arch != 'aarch64' || vars.AARCH64_MUSL_LINKER != ''
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ vars.AARCH64_MUSL_LINKER }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        if: matrix.arch != 'aarch64' || vars.AARCH64_MUSL_LINKER != ''
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          OUT="tuishou-${TAG}-${TARGET}"
          # build.rs writes generated docs under OUT_DIR, not into the source tree.
          docs="$(find "target/${TARGET}/release/build" -type f -name tuishou.bash -path '*/out/*' -print -quit)"
          if [ -z "$docs" ]; then
            echo "generated docs not found under OUT_DIR" >&2
            exit 1
          fi
          generated="$(dirname "$docs")"
          mkdir -p dist
          cp "target/${TARGET}/release/tuishou" "dist/tuishou"
          cp "$generated/tuishou.bash" "$generated/tuishou.zsh" "$generated/tuishou.fish" "$generated/tuishou.1" dist/
          tar -C dist -czf "${OUT}.tar.gz" tuishou tuishou.bash tuishou.zsh tuishou.fish tuishou.1
          sha256sum "${OUT}.tar.gz" > "${OUT}.tar.gz.sha256"
      - name: Upload artifact
        if: matrix.arch != 'aarch64' || vars.AARCH64_MUSL_LINKER != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tuishou-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            tuishou-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            tuishou-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

  sbom:
    name: SBOM
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set release version
        run: python3 scripts/set-release-version.py set "$TAG"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename "tuishou-${TAG}.cdx"
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tuishou-${{ github.ref_name }}-sbom
          path: tuishou-${{ github.ref_name }}.cdx.json

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, sbom]
    if: github.ref_type == 'tag'
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" -D release
          find release -type f -mindepth 2 -maxdepth 2 -exec mv {} release/ \;
          find release -type d -empty -delete
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--title "$TAG" --generate-notes)
          if [[ "$TAG" == *-dev.* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" release/* "${args[@]}"

  prune:
    name: Prune dev pre-releases
    needs: [release]
    if: contains(github.ref_name, '-dev.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete old dev pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName')"
          mapfile -t old < <(python3 scripts/set-release-version.py prune-list --keep 10 <<< "$releases")
          if ((${#old[@]} == 0)); then
            echo "::notice::no old dev pre-releases to prune"
            exit 0
          fi
          for tag in "${old[@]}"; do
            echo "::notice::deleting old dev pre-release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
